<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board</title>
<link rel="stylesheet" href="/platinum/popup.css">
<script src="/ui/vendor/marked.min.js"></script>
<script src="/ui/vendor/purify.min.js"></script>
<style>
/* The Board: task threads for the agent CLIs (Claude Code, Codex) on a VM
   or the host, their schedules, and the machines they run on. Platinum
   values match the exe desktop (the same blocks as Blue Pencil and Hub). */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --lav: #ccf; --red: #cc3333; --green: #1f9e33;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
  --mono: "Berkeley Mono", "Monaco", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* --vvh is the visual viewport (a phone's keyboard shrinks it): the page
   is never taller, so the composer stays above the keys */
html, body { height: var(--vvh, 100%); }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g300);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }
[hidden] { display: none !important; }

button { font: inherit; cursor: default; }
button.ghost { position: relative; background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px; white-space: nowrap;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost:disabled { color: #777; border-color: #888; background: var(--g300); box-shadow: none; }
button.ghost.danger { color: #7a1010; }
button.ghost.danger:disabled { color: #777; }
button.ghost.armed { background: var(--red); color: #fff; }
button.ghost.open { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888, inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost.default { outline: 2px solid var(--black); outline-offset: 1px; border-radius: 4px; }
button:focus:not(.default) { outline: none; }
/* a phone's finger is wider than the 20px button: the hit area grows past
   the pixels, never the pixels themselves (the desktop's close box does
   the same); rows keep 12px between buttons, so neighbours never overlap */
body.mobile button.ghost::before { content: ""; position: absolute; inset: -6px -3px; box-sizing: border-box; }

input[type=text], input[type=password], input[type=number], textarea { font: inherit; color: var(--black); background: #fff;
  border: 1px solid var(--black); padding: 2px 5px; border-radius: 0; height: 20px;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff;
  user-select: text; cursor: text; }
input:focus, textarea:focus { outline: 2px solid #9999fe; outline-offset: 0; }
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
textarea { height: auto; resize: none; padding: 4px 6px; line-height: 17px; }
/* iOS zooms into a focused field under 16px; the desktop pins the page
   scale on iOS for that, and so does this app when it is opened bare */
/* a Platinum check box: sunken white square, a black check when on */
input[type=checkbox] { appearance: none; -webkit-appearance: none; margin: 0; width: 12px; height: 12px; flex: none;
  background: #fff; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #999, 1px 1px 0 #fff; }
input[type=checkbox]:checked { background: #fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" shape-rendering="crispEdges"><path fill="black" d="M1 4h1v1H1zM2 5h1v1H2zM3 6h1v1H3zM4 7h1v1H4zM5 6h1v1H5zM6 5h1v1H6zM7 4h1v1H7zM8 3h1v1H8zM8 2h1v1H8zM2 4h1v1H2zM3 5h1v1H3zM4 6h1v1H4zM5 5h1v1H5zM6 4h1v1H6zM7 3h1v1H7z"/></svg>') center no-repeat; }
input[type=checkbox]:disabled { background-color: var(--g200); border-color: #888; box-shadow: none; }
input[type=checkbox]:focus { outline: none; }
label.check { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
label.check.dis { color: #888; }
.popup { width: 140px; flex: none; }

/* ---- the tab control (the desktop's Configuration and VM windows) ---- */
#tabs { flex: none; padding: 10px 12px 0; }
.tabbar { display: flex; align-items: flex-start; padding: 0 4px; position: relative; z-index: 2; }
.tab {
  height: 22px; color: #000; font-size: 11px; font-weight: bold; line-height: 14px;
  text-align: center; padding: 0 2px; position: relative; white-space: nowrap;
  border-style: solid; border-width: 8px 14px 0 14px;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='22'><path d='M4.5 23 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.5 23' fill='%23ccc' stroke='%23000'/><path d='M6.2 23 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23ddd'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.8 23' fill='none' stroke='%23aaa'/></svg>") 8 14 0 14 fill stretch;
}
.tab + .tab { margin-left: -7px; }
.tab.active {
  height: 25px; margin-bottom: -3px; z-index: 3;
  border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='25'><path d='M3.8 25 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L40.2 25 Z' fill='%23eee'/><path d='M4.9 22 L11 5.5 Q11.8 1.5 14 1.5 L30 1.5 Q32.2 1.5 33 5.5 L39.1 22' fill='none' stroke='%23000'/><path d='M6.6 22 L12 5.8 Q12.6 2.5 14 2.5 L29.5 2.5' fill='none' stroke='%23fff'/><path d='M30 2.5 Q31.6 2.5 32.2 5.8 L37.4 22' fill='none' stroke='%23bbb'/></svg>") 8 14 0 14 fill stretch;
}
body.mobile .tab { padding: 0 8px; }
.tabpanel { position: relative; border: 1px solid var(--black); background: var(--g200);
  padding: 12px; margin: 0 12px 12px; flex: 1; min-height: 0; display: flex; flex-direction: column;
  box-shadow: inset 1px 1px 0 var(--g400), inset 2px 2px 0 #fff, inset -1px -1px 0 var(--g500); }
body.mobile #tabs { padding: 8px 8px 0; }
body.mobile .tabpanel { margin: 0 8px 8px; padding: 10px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* a sunken white list or field; the always-on bar keeps widths still */
.sunk { background: #fff; border: 1px solid var(--black); overflow-y: scroll; overflow-x: hidden;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
.ph { color: #888; padding: 10px; }
.ph.err { color: var(--red); }
/* the backend is not in this build (404/410): the view says so in place */
.missing { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  color: #555; padding: 20px; line-height: 1.6; }
.missing b { color: var(--black); }
.btnrow { flex: none; display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.btnrow .grow { flex: 1; min-width: 0; }
.btnrow button.ghost { min-width: 72px; }
.muted { color: #555; font-size: 11px; }
.mono { font-family: var(--mono); font-size: 11px; }

/* ---- dots: green is live everywhere (the desktop's session column) ---- */
.dot-live { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .dot-live { animation: none; } }
.dot-err { flex: none; width: 7px; height: 7px; display: block; color: var(--red); }
.dot-err svg, .dot-q svg { display: block; }
.dot-q { flex: none; width: 7px; height: 7px; display: block; color: var(--green); }
.trow.sel .dot-err { color: #fcc; }

/* ---- Threads ---- */
#th { flex: 1; min-height: 0; display: flex; gap: 12px; }
#th-col { width: 220px; flex: none; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
#th-col .popup { width: 100%; }
#th-list { flex: 1; min-height: 0; }
#th-col .btnrow { margin-top: 4px; justify-content: flex-end; }
.trow { padding: 4px 6px 5px 8px; border-bottom: 1px solid #efefef; }
.trow .l1 { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.trow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
.trow .when { flex: none; font-size: 10px; color: #666; }
.trow .l2 { font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.sel { background: var(--hl); color: #fff; }
.trow.sel .when, .trow.sel .l2 { color: #ddd; }
.trow.archived .t { color: #777; }
.trow.sel.archived .t { color: #ddd; }

#tv { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#tv-head { flex: none; display: flex; align-items: center; gap: 8px; height: 20px; margin-bottom: 8px; }
#tv-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tv-title b { font-weight: bold; }
#tv-title .meta { color: #555; font-size: 11px; margin-left: 6px; }
.badge { flex: none; display: inline-block; font-size: 10px; line-height: 12px; padding: 1px 5px;
  border: 1px solid var(--black); background: #ffffc9; color: #000; white-space: nowrap; }
#tv-back { display: none; }
#tv-msgs { flex: 1; min-height: 0; padding: 8px 10px; user-select: text; cursor: text; }
#tv-msgs .ph { padding: 4px 0; user-select: none; }
.turn { margin: 0 0 14px; }
.turn:last-child { margin-bottom: 4px; }
.prompt { margin-left: auto; width: fit-content; max-width: 85%; background: var(--lav);
  border: 1px solid var(--black); padding: 4px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt-meta { text-align: right; font-size: 10px; color: #666; margin-top: 2px; min-height: 14px; }
.prompt-meta .badge { margin-left: 4px; }
.ev-status { font-size: 11px; color: #666; margin: 4px 0; }
.md { margin: 6px 0; overflow-wrap: anywhere; line-height: 1.5; }
.md.plain { white-space: pre-wrap; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 6px; }
.md ul, .md ol { padding-left: 20px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 12px; margin: 10px 0 4px; }
.md code { font: 11px var(--mono); background: #f4f4ef; padding: 0 2px; }
.md pre { font: 11px/1.45 var(--mono); background: #f4f4ef; border: 1px solid var(--g500);
  padding: 5px 7px; overflow-x: auto; white-space: pre; margin: 0 0 6px; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 6px; padding-left: 8px; border-left: 2px solid var(--g500); color: #444; }
.md table { border-collapse: collapse; margin: 0 0 6px; }
.md th, .md td { border: 1px solid var(--g500); padding: 2px 6px; }
.md a { color: #202a87; }
/* a tool call is one folded line; its output opens under it */
.tool { margin: 2px 0; font: 11px/1.45 var(--mono); }
.tool > summary { list-style: none; position: relative; padding-left: 14px; color: #333;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; }
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary::before { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 9px; box-sizing: content-box;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="5" height="9" shape-rendering="crispEdges"><path fill="black" d="M0 0h1v9H0zM1 1h1v7H1zM2 2h1v5H2zM3 3h1v3H3zM4 4h1v1H4z"/></svg>') no-repeat; }
.tool[open] > summary::before { left: 1px; top: 5px; width: 9px; height: 5px;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="5" shape-rendering="crispEdges"><path fill="black" d="M0 0h9v1H0zM1 1h7v1H1zM2 2h5v1H2zM3 3h3v1H3zM4 4h1v1H4z"/></svg>'); }
.tool.err > summary { color: #7a1010; }
.tool.pending > summary { color: #777; }
.tool pre { margin: 2px 0 4px 14px; padding: 4px 6px; background: #f4f4ef; border: 1px solid var(--g500);
  max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.tool.err pre { border-color: #c99; }
.turn-end { font-size: 10px; color: #666; margin-top: 4px; }
.turn-end.err { color: var(--red); }

#composer { flex: none; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
#cp-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
#cp-opts .fld { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
#cp-opts .fld .popup { width: 120px; }
#cp-opts .fld.sess { flex: 1; min-width: 160px; }
#cp-opts .fld.sess .popup { flex: 1; width: auto; min-width: 0; }
#cp-fixed { color: #555; font-size: 11px; }
#cp-text { width: 100%; min-height: 44px; overflow-y: hidden; }
#cp-row { display: flex; align-items: center; gap: 12px; }
#cp-hint { flex: 1; min-width: 0; font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cp-send { min-width: 72px; }

/* ---- Schedules ---- */
.grid-head, .jrow { display: grid; grid-template-columns: 18px minmax(80px, 1fr) 110px minmax(90px, 1.2fr) 92px 64px; gap: 0 8px; align-items: center; }
.grid-head { flex: none; padding: 0 8px 3px; font-size: 10px; font-weight: bold; color: #555; }
.jrow { padding: 4px 8px; border-bottom: 1px solid #efefef; white-space: nowrap; }
.jrow > span { overflow: hidden; text-overflow: ellipsis; }
.jrow .nm { font-weight: bold; }
.jrow.sel { background: var(--hl); color: #fff; }
.jrow.sel .muted { color: #ddd; }
.jrow.off .nm, .jrow.off .mono { color: #888; }
.jrow.sel.off .nm, .jrow.sel.off .mono { color: #bbb; }
#sc-list { flex: 1 1 55%; min-height: 80px; }
#sc-runs-head { flex: none; margin: 14px 0 6px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sc-runs { flex: 1 1 45%; min-height: 70px; }
.rrow { padding: 3px 8px; border-bottom: 1px solid #efefef; }
.rrow .l1 { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.rrow .l1 .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rrow a { color: #202a87; text-decoration: underline; }
.rrow pre { font: 11px/1.45 var(--mono); background: #f4f4ef; border: 1px solid var(--g500); margin: 3px 0 2px;
  padding: 4px 6px; max-height: 200px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.chip { display: inline-block; font-size: 10px; line-height: 12px; padding: 1px 5px; border: 1px solid var(--black);
  background: var(--g300); color: #000; }
.chip.ok { background: #cfc; }
.chip.error { background: #fcc; }
.chip.running { background: #ffffc9; }
.chip.skipped { background: var(--g200); color: #555; }

/* ---- Machines ---- */
#mc { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
/* a group box: the etched OS 9 frame with its title on the line */
.grp { position: relative; border: 1px solid var(--g600); box-shadow: inset 1px 1px 0 #fff, 1px 1px 0 #fff;
  padding: 14px 12px 12px; margin: 8px 0 18px; }
.grp > .gt { position: absolute; top: -9px; left: 8px; padding: 0 4px; background: var(--g200); font-weight: bold; }
.grp .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.grp .row:last-child { margin-bottom: 0; }
.grp .row .lbl { width: 150px; text-align: right; flex: none; }
.grp .row .hint { font-size: 10px; color: #666; }
.mem-line { margin-bottom: 6px; }
.mem-line.hot { color: var(--red); }
/* the memory bar: a sunken track, the used share in --hl (red past the
   cap), the cap a 1px black mark of its own */
.mbar { position: relative; height: 12px; background: #fff; border: 1px solid var(--black);
  box-shadow: -1px -1px 0 var(--g600), 1px 1px 0 #fff; }
.mbar .used { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hl); }
.mbar .used.hot { background: var(--red); }
.mbar .cap { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px solid var(--black); }
.vgrid-head, .vrow { display: grid; grid-template-columns: minmax(70px, 1fr) 62px 96px 34px 64px minmax(70px, 1fr) 82px 58px; gap: 0 8px; align-items: center; }
.vgrid-head { font-size: 10px; font-weight: bold; color: #555; padding: 0 0 3px; }
.vrow { padding: 4px 0; border-top: 1px solid var(--g500); box-shadow: inset 0 1px 0 #fff; }
.vrow > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .nm { font-weight: bold; }
.vrow .popup { width: 96px; }
.vrow input[type=text] { width: 64px; }
.vrow button.ghost { width: 58px; padding: 0; }
.vrow .stop.soon { color: var(--red); font-weight: bold; }
.vrow .lab { display: none; }
.st-running { color: #0f6b20; }
.st-stopped { color: #666; }
.agent-line { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 6px; }
.agent-line .nm { width: 96px; flex: none; font-weight: bold; }
.agent-line .what { flex: 1; min-width: 0; }
.agent-line button.ghost { width: 72px; padding: 0; }
#ag-progress { font-size: 11px; color: #555; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.secret-row input[type=password] { flex: 1; min-width: 140px; max-width: 320px; }
.secret-row .set { font-size: 11px; width: 52px; flex: none; }
.secret-row .set.on { color: #0f6b20; }

/* ---- phones: one column, the thread view in place of the list ---- */
body.mobile #th-col { width: auto; flex: 1; min-width: 0; }
body.mobile #th #tv { display: none; }
body.mobile.th-open #th #th-col { display: none; }
body.mobile.th-open #th #tv { display: flex; }
body.mobile #tv-back { display: block; }
body.mobile .trow { padding: 8px 8px 9px 10px; }
body.mobile .jrow { grid-template-columns: 18px 1fr auto; padding: 8px; row-gap: 2px; }
body.mobile .jrow .c-what { grid-column: 2 / 4; }
body.mobile .jrow .c-sched { grid-column: 3; grid-row: 1; text-align: right; }
body.mobile .jrow .c-next { grid-column: 2; }
body.mobile .jrow .c-last { grid-column: 3; justify-self: end; }
body.mobile .grid-head, body.mobile .vgrid-head { display: none; }
body.mobile .vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 0; }
body.mobile .vrow > span { display: inline-flex; align-items: center; gap: 5px; overflow: visible; }
body.mobile .vrow .nm { flex: 1 1 60%; }
body.mobile .vrow .held { flex-basis: 100%; overflow: hidden; }
body.mobile .vrow .lab { display: inline; font-size: 11px; color: #555; }
body.mobile .grp .row .lbl { width: auto; text-align: left; flex-basis: 100%; }
body.mobile .rrow { padding: 6px 8px; }

/* the options dialog and the confirms: a Platinum panel on a veil (Blue
   Pencil's and the Hub's) */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.12); display: none; z-index: 40;
  align-items: center; justify-content: center; padding: 12px; }
#veil.on { display: flex; }
#dlg { width: 440px; max-width: 100%; max-height: 100%; overflow-y: auto; background: var(--g300); border: 1px solid var(--black); padding: 14px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #999, 2px 2px 0 rgba(0,0,0,.25); }
#dlg h2 { font-size: 12px; margin: 0 0 12px; }
#dlg .row { margin: 0 0 8px; display: grid; grid-template-columns: 92px 1fr; column-gap: 6px; align-items: center; }
#dlg .row > label:first-child { text-align: right; }
#dlg .row .popup { width: 100%; }
#dlg .row input[type=text] { width: 100%; }
#dlg .row textarea { width: 100%; min-height: 80px; }
#dlg .row .hint { grid-column: 2; margin-top: 3px; font-size: 10px; color: #666; }
#dlg .row.top { align-items: start; }
#dlg .row.top > label:first-child { padding-top: 3px; }
#dlg .msg { font-weight: bold; margin-bottom: 6px; user-select: text; }
#dlg .detail { font-size: 11px; margin-bottom: 4px; user-select: text; }
#dlg .btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 14px; }
#dlg .btns button { min-width: 58px; }
body.mobile #dlg .row { grid-template-columns: 1fr; row-gap: 3px; }
body.mobile #dlg .row > label:first-child { text-align: left; }
body.mobile #dlg .row .hint { grid-column: 1; }

/* a contextual menu, the desktop's (Blue Pencil's .dropdown block) */

  if (detail) d.append(el("div", { class: "detail" }, detail));
  if (body) d.append(...body);
  const okB = el("button", { class: "ghost default" + (danger ? " danger" : "") }, ok);
  const btns = el("div", { class: "btns" });
  if (cancel) btns.append(el("button", { class: "ghost", onclick: () => close(false) }, cancel));
  btns.append(okB);
  d.append(btns);
  $("#veil").classList.add("on");
  const close = v => {
    $("#veil").classList.remove("on");
    document.removeEventListener("keydown", key, true);
    const r = dlgDone; dlgDone = null;
    if (r) r(v);
  };
  okB.onclick = () => close(true);
  const key = e => {
    if (e.key === "Escape") { e.preventDefault(); close(false); }
    else if (e.key === "Enter" && !(e.target && e.target.tagName === "TEXTAREA") && !e.isComposing) { e.preventDefault(); close(true); }
  };

    dlgDone = res;
    const first = d.querySelector("input:not([type=checkbox]), textarea, select");

}

// Threads

let threads = [], boardOK = null, filter = pref("filter", "");
const view = { mode: "new", id: null, thread: null, turns: new Map(), queued: new Set(),
  lastSeq: 0, es: null, retry: 0, timer: 0, link: "" };
const msgs = $("#tv-msgs");

async function loadThreads() {

let threadsTimer = 0;
const scheduleThreads = () => { clearTimeout(threadsTimer); threadsTimer = setTimeout(loadThreads, 300); };

function renderFilter() {

}
$("#th-filter").onchange = () => { filter = $("#th-filter").value; setPref("filter", filter); renderList(); };

function renderList() {
  const box = $("#th-list");

  }

    const row = el("div", { class: "trow" + (t.id === view.id ? " sel" : "") + (t.archived ? " archived" : ""),

        + (t.updated_at ? "\nupdated " + fullTime(t.updated_at) : "") });
    const l1 = el("div", { class: "l1" });
    const dot = stateDot(t.state);
    if (dot) l1.append(dot);
    l1.append(el("span", { class: "t" }, t.title || firstLine(t.last_text) || "Untitled"),
      el("span", { class: "when" }, ago(t.updated_at || t.created_at)));
    row.append(l1, el("div", { class: "l2" }, (t.target === "host" ? "host" : t.target) + " · " + agentName(t.agent)
      + (t.last_text ? " — " + firstLine(t.last_text) : "")));
    row.onclick = () => openThread(t.id);
    row.addEventListener("contextmenu", e => { e.preventDefault(); threadMenu(t, e.clientX, e.clientY); });
    return row;
  }));
  const sel = box.querySelector(".trow.sel");

}
function revealRow(list, row) {
  const l = list.getBoundingClientRect(), r = row.getBoundingClientRect();
  if (r.top < l.top) list.scrollTop += r.top - l.top;
  else if (r.bottom > l.bottom) list.scrollTop += r.bottom - l.bottom;
}

// ---- the open thread ----
function renderHead() {
  const t = view.thread;
  const title = $("#tv-title");
  if (view.mode !== "thread" || !t) {
    title.replaceChildren(el("b", {}, "New Task"), el("span", { class: "meta" }, "a new thread for an agent CLI"));
    $("#tv-stop").hidden = $("#tv-more").hidden = $("#tv-queued").hidden = true;
    return;
  }
  const running = [...view.turns.values()].some(x => x.state === "running") || t.state === "running";
  title.replaceChildren(el("b", {}, t.title || "Untitled"),
    el("span", { class: "meta" }, targetName(t.target) + " · " + agentName(t.agent) + (t.archived ? " · archived" : "")));
  title.title = (t.title || "") + "\n" + targetName(t.target) + " · " + agentName(t.agent)
    + (t.session_id ? "\nsession " + t.session_id : "");
  const q = view.queued.size;
  $("#tv-queued").hidden = !q;
  $("#tv-queued").textContent = q + " queued";
  $("#tv-stop").hidden = !(running || q || t.state === "queued");
  $("#tv-more").hidden = false;
}
const atBottom = () => msgs.scrollTop + msgs.clientHeight >= msgs.scrollHeight - 40;
const scrollEnd = () => { msgs.scrollTop = msgs.scrollHeight; };

function addTurn(id, prompt, state, origin) {
  let t = view.turns.get(id);
  if (t) return t;
  const box = el("div", { class: "turn" });
  const pr = el("div", { class: "prompt" }, prompt || "");
  const meta = el("div", { class: "prompt-meta" });
  const body = el("div", { class: "turn-body" });
  const foot = el("div", { class: "turn-end", hidden: true });
  box.append(pr, meta, body, foot);
  const ph = msgs.querySelector(":scope > .ph");
  if (ph) ph.remove();
  msgs.append(box);
  t = { id, box, pr, meta, body, foot, tools: new Map(), state, origin: origin || "" };
  view.turns.set(id, t);
  setTurnState(t, state || "running");
  return t;
}
function setTurnState(t, state) {
  t.state = state;
  t.meta.replaceChildren();
  if (t.origin && t.origin.startsWith("cron:")) t.meta.append("from a schedule");
  if (state === "queued") t.meta.append(el("span", { class: "badge" }, "queued"));
  else if (state === "running") t.meta.append(el("span", { class: "badge" }, "running"));
}
function mdBlock(text) {
  const d = el("div", { class: "md" });
  if (window.marked && window.DOMPurify) {
    try {
      d.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
      d.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
      return d;
    } catch (e) {}
  }
  d.classList.add("plain");
  d.textContent = text;
  return d;
}
function toolEl(ev) {
  const d = el("details", { class: "tool pending" });
  const label = ev.summary || ev.name || "tool";
  d.append(el("summary", { title: label }, label));
  return d;
}
function fillTool(d, ev) {
  d.classList.remove("pending");
  d.classList.toggle("err", !!ev.is_error);
  let pre = d.querySelector("pre");
  if (!pre) { pre = el("pre"); d.append(pre); }
  pre.textContent = ev.output || "(no output)";
}
function endTurn(t, ev) {
  const state = ev.state || "done";
  setTurnState(t, state);
  t.body.querySelectorAll(".tool.pending").forEach(d => d.classList.remove("pending"));
  const parts = [state === "done" ? "done" : state];
  const u = ev.usage;
  if (u && (u.input_tokens || u.output_tokens)) parts.push(kfmt(u.input_tokens) + " in / " + kfmt(u.output_tokens) + " out");
  if (u && u.cost_usd) parts.push("$" + (+u.cost_usd).toFixed(u.cost_usd < 1 ? 3 : 2));
  if (ev.error) parts.push(ev.error);
  t.foot.textContent = parts.join(" · ");
  t.foot.classList.toggle("err", state === "error");
  t.foot.hidden = false;
}
function applyEvent(ev, live) {
  if (!ev || typeof ev !== "object") return;
  if (typeof ev.seq === "number") {
    if (ev.seq <= view.lastSeq) return;
    view.lastSeq = ev.seq;
  }
  const stick = live && atBottom();
  const t = ev.turn_id ? addTurn(ev.turn_id, ev.type === "turn_start" ? ev.prompt : "", "running") : null;
  const into = t ? t.body : msgs;
  switch (ev.type) {
    case "turn_start":
      if (ev.prompt && !t.pr.textContent) t.pr.textContent = ev.prompt;
      view.queued.delete(t.id);
      setTurnState(t, "running");
      break;
    case "status":
      into.append(el("div", { class: "ev-status" }, ev.text || ""));
      break;
    case "text":
      if (ev.text) into.append(mdBlock(ev.text));
      break;
    case "tool": {
      const d = toolEl(ev);
      if (t && ev.id) t.tools.set(ev.id, d);
      into.append(d);
      break;
    }
    case "tool_result": {
      let d = t && ev.id ? t.tools.get(ev.id) : null;
      if (!d) { d = toolEl({ summary: "tool output" }); into.append(d); if (t && ev.id) t.tools.set(ev.id, d); }
      fillTool(d, ev);
      break;
    }
    case "turn_end":
      if (t) endTurn(t, ev);
      break;
  }
  if (live) {
    if (stick) scrollEnd();
    if (ev.type === "turn_start" || ev.type === "turn_end") { renderHead(); scheduleThreads(); }
  }
}

async function openThread(id) {
  closeStream();
  hideMenu();
  view.mode = "thread"; view.id = id; view.turns.clear(); view.queued.clear(); view.lastSeq = 0;
  view.thread = threads.find(t => t.id === id) || { id, title: "", target: "", agent: "", state: "" };
  document.body.classList.add("th-open");
  renderList();
  renderHead();
  renderComposer();
  msgs.replaceChildren(el("div", { class: "ph" }, "Loading…"));
  let d;
  try { d = await j("/v1/jx/board/threads/" + encodeURIComponent(id)); }
  catch (e) {
    if (view.id !== id) return;
    msgs.replaceChildren(el("div", { class: "ph err" }, e.status === 404 ? "This thread is gone." : e.message));
    return;
  }
  if (view.id !== id) return;
  view.thread = d.thread || view.thread;
  msgs.replaceChildren();
  for (const tr of d.turns || []) {
    const t = addTurn(tr.id, tr.prompt, tr.state, tr.origin);
    if (tr.state === "queued") view.queued.add(tr.id);
    for (const ev of tr.events || []) applyEvent(ev, false);
    if (!["queued", "running"].includes(tr.state) && t.foot.hidden)
      endTurn(t, { state: tr.state, error: tr.error, usage: tr.usage });
    else setTurnState(t, tr.state);
  }
  if (!view.turns.size) msgs.append(el("div", { class: "ph" }, "No messages yet."));
  renderHead();
  renderComposer();
  scrollEnd();
  openStream();
}
function newTask() {
  closeStream();
  hideMenu();
  view.mode = "new"; view.id = null; view.thread = null; view.turns.clear(); view.queued.clear(); view.lastSeq = 0;
  document.body.classList.add("th-open");
  renderList();
  renderHead();
  renderComposer();
  msgs.replaceChildren(el("div", { class: "ph" },
    "Start a task: pick where it runs and which agent, then write what you want done. "
    + "Each message is one turn of the agent's CLI; the daemon runs it, so it keeps going when this window closes. "
    + "Continue picks up a session the CLI already has there; Fork starts a copy of it."));
  loadSessions();
  if (!IS_MOBILE) $("#cp-text").focus();
}
function backToList() {
  closeStream();
  document.body.classList.remove("th-open");
  view.mode = "new"; view.id = null; view.thread = null;
  renderList();
}
$("#th-new").onclick = newTask;
$("#tv-back").onclick = backToList;

// ---- the live stream: SSE with ?after=, reconnected with the last seq ----
function closeStream() {
  clearTimeout(view.timer); view.timer = 0;
  if (view.es) { view.es.onerror = view.es.onmessage = null; view.es.close(); view.es = null; }
  setLink("");
}
function setLink(s) { view.link = s; renderStatus(); }
function openStream() {
  closeStream();
  const id = view.id;
  if (!id || hidden) return;
  const es = new EventSource(withToken("/v1/jx/board/threads/" + encodeURIComponent(id) + "/events", { after: String(view.lastSeq) }));
  view.es = es;
  es.onopen = () => { view.retry = 0; setLink("live"); };
  es.onmessage = e => {
    if (view.id !== id) return;
    let ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    applyEvent(ev, true);
  };
  es.onerror = () => {
    if (view.es !== es) return;
    es.close();
    view.es = null;
    const delay = Math.min(15000, 1000 * 2 ** view.retry++);
    setLink("reconnecting…");
    view.timer = setTimeout(() => { if (view.id === id) openStream(); }, delay);
  };
}

// ---- thread actions ----
function threadMenu(t, x, y, owner) {
  showMenu(x, y, [
    { label: "Rename…", act: () => renameThread(t) },
    { label: t.archived ? "Unarchive" : "Archive", act: () => patchThread(t, { archived: !t.archived }) },
    "-",
    { label: "Copy Session ID", dis: !t.session_id, act: () => copyText(t.session_id, "session id") },
    "-",
    { label: "Delete…", act: () => deleteThread(t) },

}
$("#tv-more").onclick = e => {
  if (!view.thread) return;
  if (menuOwner === e.currentTarget) { hideMenu(); return; }
  const r = e.currentTarget.getBoundingClientRect();
  threadMenu(view.thread, r.left, r.bottom + 2, e.currentTarget);
};
$("#tv-stop").onclick = async () => {
  if (!view.id) return;
  try { await api("/v1/jx/board/threads/" + encodeURIComponent(view.id) + "/stop", { method: "POST" }); toast("Stopping…"); }
  catch (e) { toast(e.message); }

async function renameThread(t) {

    const nt = await j("/v1/jx/board/threads/" + encodeURIComponent(t.id), { method: "PATCH", json: body });
    if (nt && view.id === t.id) { view.thread = Object.assign({}, view.thread, nt); renderHead(); }

    detail: "The thread and its messages leave the Board. The agent's own session stays on " + targetName(t.target)
      + ", where Continue can still pick it up.", ok: "Delete", danger: true });

// ---- the composer ----
const cpText = $("#cp-text");
function renderComposer() {
  const isNew = view.mode !== "thread";
  $("#cp-f-target").hidden = $("#cp-f-agent").hidden = $("#cp-f-sess").hidden = !isNew;
  $("#cp-fixed").hidden = isNew;
  if (!isNew && view.thread) $("#cp-fixed").textContent = "To this thread on " + targetName(view.thread.target) + ", " + agentName(view.thread.agent) + ".";
  $("#cp-fork-label").textContent = isNew ? "Fork" : "Fork into a new thread";
  $("#cp-fork").checked = false;

  $("#cp-hint").textContent = IS_MOBILE ? "" : (IS_MAC ? "⌘↩" : "Ctrl+Enter") + " sends";
  cpText.placeholder = isNew ? "What should the agent do?" : "Reply, or give the next task (queued while a turn runs)";
}
function updateFork() {
  const isNew = view.mode !== "thread";
  const can = isNew ? !!$("#cp-session").value : !!(view.thread && view.thread.session_id);
  const f = $("#cp-fork");
  f.disabled = !can;
  if (!can) f.checked = false;
  $("#cp-f-fork").classList.toggle("dis", !can);

    : isNew ? "Pick a session to continue first" : "The thread has no agent session yet";
}
let sessSeq = 0;
async function loadSessions() {
  const sel = $("#cp-session"), target = $("#cp-target").value, agent = $("#cp-agent").value;
  const my = ++sessSeq;
  sel.replaceChildren(option("", "New session"));
  updateFork();
  if (!target || !agent || boardOK === false) return;
  let list = [];
  try { list = (await j("/v1/jx/board/sessions?" + new URLSearchParams({ target, agent }))) || []; }
  catch (e) { if (my === sessSeq) sel.append(el("option", { disabled: true }, missing(e) ? "(no sessions list in this build)" : "(sessions: " + trunc(e.message, 40) + ")")); return; }
  if (my !== sessSeq) return;
  if (!list.length) return;
  const g = el("optgroup", { label: "Continue ▸" });
  for (const s of list) {
    const o = option(s.id, trunc(s.title || s.id.slice(0, 8), 52) + " — " + ago(s.updated_at) + (s.thread_id ? " (on the Board)" : ""));
    o.dataset.thread = s.thread_id || "";
    o.title = (s.title || s.id) + (s.cwd ? "\n" + s.cwd : "");
    g.append(o);
  }
  sel.append(g);
}
$("#cp-target").onchange = () => { setPref("target", $("#cp-target").value); loadSessions(); };
$("#cp-agent").onchange = () => { setPref("agent", $("#cp-agent").value); loadSessions(); };
$("#cp-agent").value = pref("agent", "claude");
$("#cp-session").onchange = updateFork;
// the field grows a line at a time with its text, up to a third of the
// window, then scrolls as any field does
function fitText() {
  const lh = 17, max = Math.max(3, Math.floor(window.innerHeight * 0.33 / lh));
  cpText.style.overflowY = "hidden";
  cpText.style.height = "auto";
  const need = cpText.scrollHeight + 2, cap = max * lh + 10;
  cpText.style.height = Math.max(44, Math.min(need, cap)) + "px";
  cpText.style.overflowY = need > cap ? "auto" : "hidden";
}
cpText.addEventListener("input", fitText);
window.addEventListener("resize", fitText);
cpText.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); send(); }
});
$("#cp-send").onclick = send;
let sending = false;
async function send() {
  const text = cpText.value;
  if (!text.trim() || sending) return;
  sending = true;
  $("#cp-send").disabled = true;
  const done = () => { cpText.value = ""; fitText(); };
  try {
    if (view.mode === "thread" && view.thread) {
      const th = view.thread;
      if ($("#cp-fork").checked && th.session_id) {
        const r = await j("/v1/jx/board/threads", { method: "POST",
          json: { target: th.target, agent: th.agent, session: th.session_id, fork: true, prompt: text, origin: "user" } });
        done();
        await loadThreads();
        if (r && r.thread) openThread(r.thread.id);
      } else {
        const id = th.id;
        const r = await j("/v1/jx/board/threads/" + encodeURIComponent(id) + "/turns", { method: "POST", json: { prompt: text } });
        done();
        if (view.id === id && r && r.turn_id) {
          const t = addTurn(r.turn_id, text, r.queued ? "queued" : "running", "user");
          if (!t.pr.textContent) t.pr.textContent = text;
          if (r.queued && t.state === "queued") view.queued.add(r.turn_id);
          renderHead();
          scrollEnd();
        }
        scheduleThreads();
      }
    } else {
      const target = $("#cp-target").value, agent = $("#cp-agent").value;
      const sel = $("#cp-session"), sid = sel.value, fork = !!sid && $("#cp-fork").checked;
      const onBoard = sid && sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.thread : "";
      if (onBoard && !fork) {

    row("Dev:", fields.dev, "min"), row("Agent:", fields.agent, "min"), row("Service:", fields.service, "min"), row("Job:", fields.job, "min"),
    row("Warn before stop:", fields.warn, "min"),
    row("Memory cap:", fields.cap, "% of host memory — a start that would cross it stops idle VMs first; 0 is off"),
    el("div", { class: "row" }, el("span", { class: "lbl" }), save));
}

// ---- agents in a target: installed? signed in? ----
let agSeq = 0, agWatch = 0, agWatchUntil = 0;
async function loadAgents() {
  const target = $("#ag-target").value || "host";
  const my = ++agSeq;
  let st;
  try { st = (await j("/v1/jx/agents/status?" + new URLSearchParams({ target }))) || {}; }
  catch (e) {
    if (my !== agSeq) return;
    $("#ag-rows").replaceChildren(el("div", { class: "ph" + (missing(e) ? "" : " err") }, missing(e) ? "Agent status is not available in this build." : e.message));
    return;
  }
  if (my !== agSeq) return;
  const AUTH = { token: "signed in with the saved token", login: "signed in in the guest", none: "not signed in" };
  $("#ag-rows").replaceChildren(...Object.keys(AGENTS).map(a => {
    const s = st[a] || {};
    const what = s.installed
      ? "installed" + (s.version ? " " + s.version : "") + " · " + (AUTH[s.auth] || s.auth || "auth unknown")
      : "not installed";
    const btn = el("button", { class: "ghost", disabled: !!s.installed }, s.installed ? "Installed" : "Install");
    btn.onclick = () => installAgent(target, a, btn);
    return el("div", { class: "agent-line" }, el("span", { class: "nm" }, AGENTS[a]), el("span", { class: "what" }, what), btn);
  }));
  const all = Object.keys(AGENTS).every(a => st[a] && st[a].installed);
  if (agWatch && (all || Date.now() > agWatchUntil)) { clearInterval(agWatch); agWatch = 0; }
}
async function installAgent(target, agent, btn) {
  btn.disabled = true;
  try {
    await api("/v1/jx/agents/install", { method: "POST", json: { target, agent } });
    $("#ag-progress").textContent = "Installing " + AGENTS[agent] + " on " + targetName(target) + "…";
    clearInterval(agWatch);
    agWatchUntil = Date.now() + 10 * 60000;
    agWatch = setInterval(loadAgents, 4000);
  } catch (e) { toast(e.message, 5000); btn.disabled = false; }
}
function agentProgress(m) {
  const t = $("#ag-target").value;
  if (m.target && m.target !== t) return;
  $("#ag-progress").textContent = (m.agent ? agentName(m.agent) + ": " : "") + (m.text || "");
  if (/done|installed|failed|error/i.test(m.text || "")) loadAgents();
}
$("#ag-target").onchange = () => { $("#ag-progress").textContent = ""; loadAgents(); };

// ---- secrets: write-only ----
function renderSecrets(s) {
  const mk = (key, label, hint, isSet) => {
    const inp = el("input", { type: "password", autocomplete: "off", spellcheck: "false",
      placeholder: isSet ? "set — type a new one to replace it" : "not set" });
    const save = el("button", { class: "ghost" }, "Save");
    const clear = el("button", { class: "ghost danger", disabled: !isSet }, "Clear");
    save.onclick = async () => {
      if (!inp.value.trim()) { toast("type the " + label.toLowerCase() + " first"); return; }
      await putSecret({ [key]: inp.value.trim() });
    };
    clear.onclick = async () => {
      const ok = await dialog({ msg: "Clear the " + label + "?", detail: "Agent turns then use whatever login each guest has.", ok: "Clear", danger: true });
      if (ok) putSecret({ [key]: "" });
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") save.click(); });
    return [
      el("div", { class: "row secret-row" }, el("label", { class: "lbl" }, label + ":"), inp,
        el("span", { class: "set" + (isSet ? " on" : "") }, isSet ? "set" : "not set"), save, clear),
      el("div", { class: "row" }, el("span", { class: "lbl" }), el("span", { class: "hint" }, hint)),
    ];
  };
  $("#sec-rows").replaceChildren(
    el("div", { class: "row" }, el("span", { class: "muted" }, "Stored on this host and copied into each VM on first use. Never shown again here.")),
    ...mk("claude_oauth_token", "Claude Code token", "from “claude setup-token” on a machine where you are signed in", !!s.claude_oauth_token_set),
    ...mk("codex_api_key", "Codex API key", "an OpenAI API key; Codex in the VMs signs in with it", !!s.codex_api_key_set));
}
async function putSecret(body) {
  try { renderSecrets((await j("/v1/jx/agents/secrets", { method: "PUT", json: body })) || {}); toast("Saved"); }
  catch (e) { toast(e.message, 5000); }
}

// ======================================================================
// tabs, status, refresh, the desktop bridge
// ======================================================================
let curTab = "threads", hidden = false;
function showTab(name) {
  if (!["threads", "sched", "mach"].includes(name)) name = "threads";
  curTab = name;
  setPref("tab", name);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  $("#v-threads").hidden = name !== "threads";
  $("#v-sched").hidden = name !== "sched";
  $("#v-mach").hidden = name !== "mach";
  hideMenu();
  if (name === "sched") loadJobs();
  if (name === "mach") loadMachines();
  if (name === "threads") fitText();
  renderStatus();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));
function renderStatus() {
  if ($("#st-text").classList.contains("err") && Date.now() - lastErrAt < 8000) return;
  let s = "";
  if (curTab === "threads") {
    if (boardOK === false) s = "Board backend not available";
    else if (boardOK) {
      const live = threads.filter(t => !t.archived);
      const run = live.filter(t => t.state === "running").length, q = live.filter(t => t.state === "queued").length;
      s = live.length + " thread" + (live.length === 1 ? "" : "s") + (run ? " · " + run + " running" : "") + (q ? " · " + q + " queued" : "");
    }
  } else if (curTab === "sched") {
    s = cronOK === false ? "Schedules not available" : jobs.length + " schedule" + (jobs.length === 1 ? "" : "s")
      + " · " + jobs.filter(x => x.enabled).length + " enabled";
  } else {
    const run = jvms.filter(v => v.state === "running").length;
    s = jvms.length ? run + " of " + jvms.length + " VMs running" : "";
  }
  status(s);
  $("#st-link").textContent = curTab === "threads" && view.id ? view.link : "";
}

async function refresh() {
  await loadVMs();
  await loadThreads();
  if (curTab === "sched") loadJobs();
  if (curTab === "mach") loadMachines();
}
setInterval(() => {
  if (hidden || document.hidden) return;
  if (curTab === "mach") loadMachines();
  else if (curTab === "sched") loadJobs();
  else { renderList(); }
}, 15000);
setInterval(() => { if (!hidden && !document.hidden) loadVMs(); }, 60000);

window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  const m = e.data;
  if (m.exe === "hide") {
    hidden = true;
    closeStream();
    closeBoardStream();
  } else if (m.exe === "show") {
    if (!hidden) return;
    hidden = false;
    refresh().then(() => { openBoardStream(); if (view.id) openStream(); });
  } else if (m.exe === "open" && typeof m.thread === "string") {
    showTab("threads");
    openThread(m.thread);
  }
});

// ---- desktop window plumbing (the same bridge as Notes and Hub) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });
const grow = $("#grow");
if (window.parent === window) grow.style.display = "none";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
}, { capture: true, passive: true });

// ---- boot ----
(async () => {
  renderComposer();
  fitText();
  showTab(pref("tab", "threads"));
  await loadVMs();
  await loadThreads();
  openBoardStream();
  const want = QS.get("thread");
  if (want) openThread(want);
  else if (!IS_MOBILE) newTask();
  else { renderHead(); msgs.replaceChildren(); }
})();
</script>
